# Claude reviews every pull request and comments on it.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`,
# uses a Claude subscription) or ANTHROPIC_API_KEY (API billing).
# Uses this run's GITHUB_TOKEN to comment, so no GitHub App is needed.
# PRs from forks are skipped: they get no secrets, and their code isn't trusted.
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned to a commit (v1.0.254) so a moved tag can't change what runs.
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Write all comments in Traditional Chinese (繁體中文).
            Report only real problems, most severe first; say nothing about style
            that a linter would catch, and don't praise.

            Check in particular:
            - Secrets: API keys, tokens or passwords committed, or *.env files
            - Kubernetes manifests and Helm values: wrong selectors or ports,
              missing resources/probes, anything that breaks ArgoCD sync, hooks or waves
            - Airflow DAGs: import errors, timezone mistakes (data is Asia/Taipei
              without a zone), non-idempotent SQL, tasks that fail silently
            - CI workflows: overly broad permissions, unpinned or untrusted actions
            - Python: unhandled errors, training and serving code drifting apart

            Use inline comments for specific lines and one short summary comment.
            If there is nothing worth reporting, post a one-line summary saying so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

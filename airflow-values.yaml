# LocalExecutor: the scheduler runs tasks itself, one process per running task.
# The DAGs run a few tasks an hour, so CeleryExecutor's always-on worker
# (16 pre-forked processes, ~1.5GiB) and its Redis broker were idle capacity
# on a single node.
executor: LocalExecutor

# CI (.github/workflows/ci.yml) rewrites these four lines to the image it
# pushed to GHCR; ArgoCD then rolls the Airflow pods to that image.
images:
  airflow:
    repository: ghcr.io/jack-lio/sql-k8s/airflow
    tag: "2.6.1-py310-119e788"
    pullPolicy: IfNotPresent

defaultAirflowRepository: ghcr.io/jack-lio/sql-k8s/airflow
defaultAirflowTag: "2.6.1-py310-119e788"

# The GHCR package is public, so no pull secret. For a private package, create
# airflow/ghcr-pull with ghcr.env (bootstrap-secrets.sh) and uncomment:
# registry:
#   secretName: ghcr-pull

# The chart generates these three with random values on every render. Helm only
# did that at install time, but ArgoCD renders on every sync and would keep
# rotating them (a new Fernet key breaks every stored connection). They are
# created once by bootstrap-secrets.sh instead.
fernetKeySecretName: airflow-fernet-key

# MOENV_API_KEY for the AQI DAGs, from the
# airflow-dag-secrets Secret (created from api-keys.env).
extraEnvFrom: |
  - secretRef:
      name: airflow-dag-secrets

webserverSecretKeySecretName: ~
webserverSecretKey: "footprintai-local-dev-secret-key"

config:
  core:
    load_examples: "False"
    dags_are_paused_at_creation: "True"
    parallelism: 4            # LocalExecutor: at most 4 task processes at once
  webserver:
    expose_config: "True"
    workers: 1                # gunicorn workers (default 4, ~340MiB each); one user

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

webserver:
  defaultUser:
    enabled: true
    username: airflow
    password: airflow
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  service:
    type: ClusterIP

scheduler:
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

# With LocalExecutor the chart runs no worker pods. These settings now size the
# task-log volume, which the chart mounts on the scheduler (a StatefulSet).
workers:
  persistence:
    size: 5Gi

# No DAG uses deferrable operators, so the triggerer had nothing to run.
triggerer:
  enabled: false

postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: "15"

redis:
  enabled: false

# ArgoCD runs these Jobs as Sync hooks: deleted and re-created on every sync,
# which avoids the "field is immutable" error that plain apply hits on Jobs.
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

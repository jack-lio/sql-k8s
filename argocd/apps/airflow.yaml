# Airflow from the official Helm chart, with this repository's values file.
# CI changes the image tag in airflow-values.yaml; ArgoCD then rolls the pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.10.0
      helm:
        releaseName: airflow
        valueFiles:
          - $values/airflow-values.yaml
    - repoURL: https://github.com/jack-lio/sql-k8s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m

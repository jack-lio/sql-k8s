# Values for the apache-airflow/airflow chart 1.10.0 on a single Raspberry Pi.
# Compared with ../airflow-values.yaml (minikube): LocalExecutor instead of
# Celery, so there are no worker, Redis or Flower pods, and Airflow's metadata
# goes to the shared Postgres in the sql namespace instead of a bundled one.

executor: LocalExecutor

images:
  airflow:
    repository: airflow-custom
    tag: dev # deploy.sh passes the real tag with --set
    pullPolicy: IfNotPresent

# Secrets created by deploy.sh from secrets.env.
data:
  metadataSecretName: airflow-metadata
fernetKeySecretName: airflow-fernet-key
webserverSecretKeySecretName: airflow-webserver-secret-key

# AIRFLOW_CONN_POSTGRES_DEFAULT (the DAGs' "postgres_default" connection),
# MOENV_API_KEY and WAQI_TOKEN.
extraEnvFrom: |
  - secretRef:
      name: airflow-dag-secrets

postgresql:
  enabled: false
redis:
  enabled: false
statsd:
  enabled: false
triggerer:
  enabled: false

config:
  core:
    load_examples: "False"
    dags_are_paused_at_creation: "True"
    # Tasks run inside the scheduler pod with LocalExecutor.
    parallelism: 4
    max_active_tasks_per_dag: 2
  scheduler:
    parsing_processes: 1
    min_file_process_interval: 60
  webserver:
    workers: 2

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

webserver:
  defaultUser:
    enabled: true
    username: airflow
    # password: passed by deploy.sh from secrets.env
  service:
    type: NodePort
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
        nodePort: 30080
  # Gunicorn starts slowly on a Pi. Chart 1.10 has no webserver startupProbe,
  # so give the liveness probe a long head start instead.
  livenessProbe:
    initialDelaySeconds: 180
    timeoutSeconds: 30
    failureThreshold: 5
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

scheduler:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1536Mi

createUserJob:
  useHelmHooks: false
migrateDatabaseJob:
  useHelmHooks: false

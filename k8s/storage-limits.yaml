# Storage limits for the sql and monitoring namespaces.
#
# These limit what PVCs may REQUEST. On minikube (hostPath) the provisioner
# does not enforce a PVC's size on disk, so the real caps are: Prometheus
# --storage.tsdb.retention.size, the 3-day retention in the AQI DAG, and the
# PostgresDatabaseLarge / NodeDiskAlmostFull alerts.
#
# Apply: kubectl apply -f k8s/storage-limits.yaml
# Check: kubectl describe resourcequota -n sql
apiVersion: v1
kind: ResourceQuota
metadata:
  name: storage
  namespace: sql
spec:
  hard:
    # Currently 2Gi + 2Gi + 1Gi (two Postgres, Grafana).
    requests.storage: 10Gi
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: storage
  namespace: sql
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: 5Gi
      min:
        storage: 100Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: storage
  namespace: monitoring
spec:
  hard:
    # Currently 5Gi for Prometheus.
    requests.storage: 10Gi
    persistentvolumeclaims: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: storage
  namespace: monitoring
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: 5Gi
      min:
        storage: 100Mi

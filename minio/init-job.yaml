# Creates the bucket, its quota and lifecycle rule, and the Airflow user.
# Idempotent; ArgoCD re-creates it after every sync (PostSync hook).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
          command: ["/bin/bash", "/scripts/init.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: AIRFLOW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AIRFLOW_ACCESS_KEY
            - name: AIRFLOW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AIRFLOW_SECRET_KEY
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: minio-init

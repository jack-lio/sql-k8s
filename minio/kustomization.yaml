apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minio

resources:
  - minio.yaml
  - init-job.yaml

configMapGenerator:
  - name: minio-init
    files:
      - init.sh

# The minio-credentials Secret is not in git: bootstrap-secrets.sh creates it
# from minio/secrets.env.
